version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions:
        patterns:
          - "*"
  
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0  # security PRs still flow; see rsr-template-repo@78b050e

  
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
  
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
