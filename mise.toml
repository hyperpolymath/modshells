[tools]
# Language runtimes
rust = "latest"
zig = "latest"
bun = "latest"
denojs = "latest"

# Package managers
pnpm = "latest"
cargo = "latest"
go-task = "latest"

# Formatting & Linting
shfmt = "latest"
stylua = "latest"

# Build tools
cmake = "latest"
ninja = "latest"

# Shell tools
git = "latest"
gnu-sed = "latest"
gnu-tar = "latest"
gnu-grep = "latest"

# Testing

[env]
# Common environment variables

# Task runner alias
[alias]
task = "go-task"

[tasks.setup]
description = "Install pinned JS dev tools (Prettier) from bun.lock"
run = "bun install --frozen-lockfile"

[tasks.build]
run = "cargo build --release"

[tasks.test]
run = "cargo test"

[tasks.lint]
depends = ["setup"]
run = "bunx --no-install --bun prettier --check ."

[tasks.fmt]
depends = ["setup"]
run = "bunx --no-install --bun prettier --write ."
